<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Toolsopedia</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <div class="hero__content">
        <p class="hero__eyebrow">Toolsopedia</p>
        <h1>All your tools, one place.</h1>
        <p class="hero__subtitle">
          Explore lightweight utilities built to solve specific tasks. Click a tool to open its app.
        </p>
      </div>
    </header>

    <main class="container">
      <section class="tools">
        <article class="tool-card">
          <div class="tool-card__content">
            <h2>PDF to Excel</h2>
            <p>Convert PDF tables into Excel files in seconds.</p>
          </div>
          <a class="tool-card__link" href="tools/pdf-to-excel-app/">Open tool</a>
        </article>
      </section>
    </main>

    <footer class="footer">
      <p>More tools coming soon.</p>
    </footer>
  </body>
</html>
